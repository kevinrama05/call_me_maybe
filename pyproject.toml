[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with Qwen3-0.6B using constrained decoding"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "huggingface-hub>=1.23.0",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "transformers>=5.13.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.mypy]
exclude = ["^llm_sdk/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["llm_sdk.*"]
ignore_errors = true
